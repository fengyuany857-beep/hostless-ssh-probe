name: tests

on:
  push:
    branches:
      - vcw-remote-runner-v1
  pull_request:

concurrency:
  group: runner-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vcw_runner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vcw_runner_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/vcw_runner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        timeout-minutes: 2
      - run: python -m py_compile app.py vcw_runner.py channel_exec.py tools/ledger_persistence_acceptance.py
